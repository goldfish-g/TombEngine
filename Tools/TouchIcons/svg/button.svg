<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- A button of the touch controls, and the D-pad's base. Colours as in TRX's touch
       controls while pressed; the engine draws them fainter when not. The engine sets the
       width of the "ring" to TRX's border width, keeping its outer edge where it is here. -->
  <circle cx="50" cy="50" r="50" fill="#1e1e1e" fill-opacity="0.824"/>
  <circle id="ring" cx="50" cy="50" r="49" fill="none" stroke="#ffffff" stroke-opacity="0.863" stroke-width="2"/>
</svg>
